<section class="container">
    <app-page-header title="Cartas de yu-gi-oh" />

    <section class="card-detail">
        @defer (when card()) {
        <section class="card-image">
            <img [src]="card()!.card_images[0].image_url" [alt]="card()!.name">
        </section>

        <section class="card-info">
            <header>
                <h1>{{ card()!.name }}</h1>
                <p>{{ card()!.type }}</p>
            </header>

            <nav class="card-tabs">
                <a routerLink="effect" routerLinkActive="active">Efecto</a>
                @if (card()!.atk !== undefined || card()!.def !== undefined) {
                <a routerLink="stats" routerLinkActive="active">Estadísticas</a>
                }
                <a routerLink="price" routerLinkActive="active">Precio</a>
            </nav>

            <router-outlet></router-outlet>
        </section>
        } @placeholder (minimum 3s) {
        <p>Cargando...</p>
        } @error {
        <p>Error al cargar la imagen</p>
        }
    </section>
</section>
