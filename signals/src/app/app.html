<div class="container" [class.sidebar-hidden]="hideSideBar()">
    <div class="header">
      Header
      <button class="menu-button" (click)="openSideBar()">
        button
      </button>
    </div>

    <div class="sidebar" [class.hidden]="!hideSideBar()">
      Sidebar
      
      <button class="sidebar-button" (click)="openSideBar()">
        button
      </button>
    </div>

    <div class="navbar1">
      Navbar 1
    </div>

    <div class="navbar2">
      Navbar 2
    </div>
    
    <div class="boxContainer">
      <div class="box card">
        Box 1
        <div>
          @for(item of getData(); track item){
              {{item.name}}
          }
        </div>
      </div>

      <div class="box card">
        Box 2
        <div>
          {{ currentDate | date }}
        </div>
      </div>

      <div class="box card">
        Box 3
        <div>
          {{ currentDate | date : "EEEE yyyy-MM-dd hh:mm:ss.SSS OOOO" }}
        </div>
      </div>

      <div class="box card">
        Box 4
        <div>
          {{ currentDate | date : "fullDate" }}
        </div>
      </div>
    </div>
</div>
